services:
  scaricafilm:
    build:
      context: .
      dockerfile: Dockerfile
    image: scaricafilm:latest
    container_name: scaricafilm
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Cartella in cui verranno salvati i film e le serie scaricate
      - ./downloads:/media
      # Cartella persistente per impostazioni e cronologia download
      - ./config:/app/config
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MEDIA_FOLDER=/media
      - CONFIG_PATH=/app/config/settings.json
      - TZ=Europe/Rome
